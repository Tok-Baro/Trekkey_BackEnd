spring.application.name=trekkey
server.port=8080

# Datasource(MySQL)
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Front
app.front.base-url=${FRONT_BASE_URL}

# File Upload
app.file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=350MB

# JWT
# JWT secret must be supplied by the runtime environment.
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh}
security.jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}
security.jwt.refresh-cookie-same-site=${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html

# Credential anchoring (disabled unless explicitly enabled)
blockchain.anchoring.mode=${BLOCKCHAIN_ANCHORING_MODE:DISABLED}
blockchain.anchoring.chain-id=${BLOCKCHAIN_CHAIN_ID:1001}
blockchain.anchoring.rpc-url=${BLOCKCHAIN_RPC_URL:https://public-en-kairos.node.kaia.io}
blockchain.anchoring.contract-address=${BLOCKCHAIN_CONTRACT_ADDRESS:}
blockchain.anchoring.runtime-code-hash=${BLOCKCHAIN_RUNTIME_CODE_HASH:}
blockchain.anchoring.contract-version=${BLOCKCHAIN_CONTRACT_VERSION:1}
blockchain.anchoring.tree-version=${BLOCKCHAIN_TREE_VERSION:1}
blockchain.anchoring.batch-size=${BLOCKCHAIN_BATCH_SIZE:100}
blockchain.anchoring.approval-ttl=${BLOCKCHAIN_APPROVAL_TTL:15m}
blockchain.anchoring.worker-enabled=${BLOCKCHAIN_WORKER_ENABLED:false}
blockchain.anchoring.worker-claim-size=${BLOCKCHAIN_WORKER_CLAIM_SIZE:10}
blockchain.anchoring.worker-max-attempts=${BLOCKCHAIN_WORKER_MAX_ATTEMPTS:8}
blockchain.anchoring.outbox-lease-timeout=${BLOCKCHAIN_OUTBOX_LEASE_TIMEOUT:1m}
blockchain.anchoring.receipt-polling-interval=${BLOCKCHAIN_RECEIPT_POLLING_INTERVAL:2s}
blockchain.anchoring.receipt-timeout=${BLOCKCHAIN_RECEIPT_TIMEOUT:2m}
blockchain.anchoring.relayer-private-key=${BLOCKCHAIN_RELAYER_PRIVATE_KEY:}
