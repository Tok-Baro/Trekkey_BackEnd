spring.application.name=trekkey
server.port=8080

# Datasource(MySQL)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/trekkey
spring.datasource.username=root
spring.datasource.password=dmsals1053

# JPA (dev mode)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# CORS
app.cors.allowed-origin=http://localhost:5173

# JWT
security.jwt.secret-key=${JWT_SECRET:ZKOiUFNIL8huvgm2/dleFikkvaD4WCChcRIpc3NkJaLtuGDA8ETfWuPcayJwOCxMlL/+joNWc4b4LKB3IHaAMQ==}
security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:1800}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600}

security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
