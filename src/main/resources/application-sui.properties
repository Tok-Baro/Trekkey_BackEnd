# Opt-in migration profile. Reads/writes remain disabled until explicitly configured.
# This does not deploy a registry, migrate a database, or connect an end-user wallet.
blockchain.anchoring.provider=SUI
blockchain.anchoring.chain-id=0
blockchain.anchoring.rpc-url=
blockchain.anchoring.contract-address=
blockchain.anchoring.runtime-code-hash=
blockchain.anchoring.relayer-private-key=

# Optional historical Kairos verification only. This never enables a Kaia writer or relayer.
# Enable only after comparing these coordinates and runtime hash with the stored deployment.
blockchain.anchoring.legacy-kaia-read-routes[0].enabled=${LEGACY_KAIA_READ_ENABLED:false}
blockchain.anchoring.legacy-kaia-read-routes[0].chain-id=${LEGACY_KAIA_CHAIN_ID:0}
blockchain.anchoring.legacy-kaia-read-routes[0].rpc-url=${LEGACY_KAIA_RPC_URL:}
blockchain.anchoring.legacy-kaia-read-routes[0].contract-address=${LEGACY_KAIA_CONTRACT_ADDRESS:}
blockchain.anchoring.legacy-kaia-read-routes[0].runtime-code-hash=${LEGACY_KAIA_RUNTIME_CODE_HASH:}
blockchain.anchoring.legacy-kaia-read-routes[0].contract-version=${LEGACY_KAIA_CONTRACT_VERSION:}
