plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

group = 'com.api'
version = '0.0.1-SNAPSHOT'
description = 'Trekkey API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20240325.1'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'org.web3j:core:4.14.0'
    implementation 'com.github.librepdf:openpdf:2.0.3'
    implementation('org.apache.pdfbox:pdfbox:3.0.8') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'io.github.openfeign.querydsl:querydsl-jpa:5.6.1:jakarta'

    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:5.6.1:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    // Test-process-only fallbacks. They are neither application defaults nor bootRun/bootJar
    // configuration, and cannot enable an external database or blockchain integration gate.
    // Keep explicitly supplied environment values and Spring test/DynamicPropertySource overrides.
    def syntheticDefaults = [
        JWT_SECRET_KEY: 'c3ludGhldGljLXRlc3Qtb25seS1ub3QtZm9yLWFueS1kZXBsb3ltZW50LTAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm',
        JWT_ACCESS_EXPIRATION: '900',
        JWT_REFRESH_EXPIRATION: '604800',
        EVIDENCE_LOOKUP_HMAC_SECRET: 'synthetic-test-only-independent-evidence-hmac-not-for-deployment',
        FRONT_BASE_URL: 'http://localhost:3000',
        CORS_ALLOWED_ORIGIN: 'http://localhost:3000',
        FILE_UPLOAD_DIR: layout.buildDirectory.dir("test-runtime/${name}/uploads").get().asFile.absolutePath
    ]
    syntheticDefaults.each { variable, fallback ->
        if (!environment.containsKey(variable)) {
            environment(variable, fallback)
        }
    }
}

sourceSets {
    main.java.srcDirs += querydslDir
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(file(querydslDir))
}

clean {
    delete querydslDir
}
