name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 21 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked local-only files
        shell: bash
        run: |
          if git ls-files --error-unmatch src/main/resources/application-local.properties >/dev/null 2>&1; then
            echo "application-local.properties must not be tracked"
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.DS_Store$'; then
            echo ".DS_Store must not be tracked"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: ./gradlew clean test --no-daemon

  contracts:
    name: Solidity tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit
