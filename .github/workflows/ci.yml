name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build executable JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject tracked local-only files
        shell: bash
        run: |
          if git ls-files --error-unmatch src/main/resources/application-local.properties >/dev/null 2>&1; then
            echo "application-local.properties must not be tracked"
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)\.DS_Store$'; then
            echo ".DS_Store must not be tracked"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon -x test
