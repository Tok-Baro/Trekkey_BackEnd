name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and deploy to EC2
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon -x test

      - name: Set image coordinates
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH and runtime configuration
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          ssh-keyscan -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          umask 077
          printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/trekkey.env"

          for key in DATASOURCE_URL DATASOURCE_USERNAME DATASOURCE_PASSWORD MYSQL_ROOT_PASSWORD \
              CORS_ALLOWED_ORIGIN FRONT_BASE_URL JWT_SECRET_KEY \
              JWT_ACCESS_EXPIRATION JWT_REFRESH_EXPIRATION; do
            if ! grep -q "^${key}=" "$RUNNER_TEMP/trekkey.env"; then
              echo "ENV_FILE is missing ${key}"
              exit 1
            fi
          done

      - name: Prepare EC2 deployment directories
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_deploy" "${EC2_USER}@${EC2_HOST}" \
            'command -v docker >/dev/null && sudo docker compose version >/dev/null && command -v curl >/dev/null'
          ssh -i "$HOME/.ssh/id_deploy" "${EC2_USER}@${EC2_HOST}" \
            'sudo install -d -m 755 /opt/trekkey && sudo install -d -m 700 /etc/trekkey && sudo install -d -o 10001 -g 10001 -m 750 /var/lib/trekkey/uploads'
          scp -i "$HOME/.ssh/id_deploy" docker-compose.prod.yml \
            "${EC2_USER}@${EC2_HOST}:/tmp/docker-compose.prod.yml"
          scp -i "$HOME/.ssh/id_deploy" "$RUNNER_TEMP/trekkey.env" \
            "${EC2_USER}@${EC2_HOST}:/tmp/trekkey.env"
          ssh -i "$HOME/.ssh/id_deploy" "${EC2_USER}@${EC2_HOST}" \
            'sudo install -m 644 /tmp/docker-compose.prod.yml /opt/trekkey/docker-compose.prod.yml && sudo install -m 600 /tmp/trekkey.env /etc/trekkey/trekkey.env && rm -f /tmp/docker-compose.prod.yml /tmp/trekkey.env'

      - name: Log in to GHCR from EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/id_deploy" \
            "${EC2_USER}@${EC2_HOST}" \
            "sudo docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy and verify
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          NEW_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          ssh -i "$HOME/.ssh/id_deploy" "${EC2_USER}@${EC2_HOST}" \
            "NEW_IMAGE='${NEW_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail

          compose() {
            sudo env BACKEND_IMAGE="$1" docker compose \
              --project-name trekkey \
              --env-file /etc/trekkey/trekkey.env \
              -f /opt/trekkey/docker-compose.prod.yml \
              "${@:2}"
          }

          previous_image=""
          if sudo test -f /opt/trekkey/.deployed-image; then
            previous_image=$(sudo cat /opt/trekkey/.deployed-image)
          fi

          sudo docker pull "$NEW_IMAGE"
          compose "$NEW_IMAGE" up -d --remove-orphans

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                'http://127.0.0.1:8080/api/organizations' >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done

          if [ "$healthy" != true ]; then
            sudo docker compose \
              --project-name trekkey \
              --env-file /etc/trekkey/trekkey.env \
              -f /opt/trekkey/docker-compose.prod.yml \
              logs --tail=100 backend

            if [ -n "$previous_image" ]; then
              compose "$previous_image" up -d --remove-orphans
            else
              compose "$NEW_IMAGE" stop backend
            fi
            exit 1
          fi

          printf '%s\n' "$NEW_IMAGE" \
            | sudo tee /opt/trekkey/.deployed-image >/dev/null
          sudo docker image prune --force >/dev/null
          REMOTE

      - name: Remove temporary secrets
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_deploy" "$RUNNER_TEMP/trekkey.env"
