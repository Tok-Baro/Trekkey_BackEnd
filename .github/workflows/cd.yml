name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build verified Sui images and request approved EC2 release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Validate completed CI event and revision
        id: revision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const run = event.workflow_run;
          const repository = process.env.GITHUB_REPOSITORY;
          if (process.env.GITHUB_EVENT_NAME !== 'workflow_run' || event.action !== 'completed'
              || repository?.toLowerCase() !== 'tok-baro/trekkey_backend'
              || event.repository?.full_name !== repository
              || run?.name !== 'Backend CI' || run.status !== 'completed'
              || run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main'
              || run.head_repository?.full_name !== repository
              || typeof run.head_sha !== 'string' || run.head_sha.length !== 40
              || !/^[0-9a-f]{40}$/.test(run.head_sha)) {
            throw new Error('CD requires successful same-repository main push CI and a full commit SHA');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + run.head_sha + '\n');
          NODE

      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout and set immutable image coordinates
        id: image
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          printf 'backend=ghcr.io/tok-baro/trekkey_backend:%s\n' "$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          printf 'gateway=ghcr.io/tok-baro/trekkey_backend-sui-gateway:%s\n' "$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build verified JAR
        run: ./gradlew clean bootJar --no-daemon -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verified backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.backend }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

      - name: Build and push verified Sui gateway image
        uses: docker/build-push-action@v7
        with:
          context: sui-gateway
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.gateway }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=sui-gateway-arm64
          cache-to: type=gha,mode=max,scope=sui-gateway-arm64

      - name: Prepare pinned SSH identity without runtime configuration
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set +x
          umask 077
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || exit 1
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || exit 1
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          ssh_dir="$RUNNER_TEMP/trekkey-sui-ssh"
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          mkdir -m 700 "$ssh_dir"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_deploy" "$ssh_dir/known_hosts"
          # Use only the independently verified EC2 ed25519 key supplied by production.
          # No host-key discovery or accept-new fallback from a network response.
          ssh-keygen -F "$EC2_HOST" -f "$ssh_dir/known_hosts" \
            | awk '$1 !~ /^#/ && $2 == "ssh-ed25519" { found=1 } END { exit !found }'
          ssh-keygen -y -P '' -f "$ssh_dir/id_deploy" >/dev/null 2>&1
          printf '%s\n' \
            'Host trekkey-sui-release' \
            "  HostName $EC2_HOST" \
            "  User $EC2_USER" \
            "  IdentityFile \"$ssh_dir/id_deploy\"" \
            "  UserKnownHostsFile \"$ssh_dir/known_hosts\"" \
            '  GlobalKnownHostsFile /dev/null' \
            '  StrictHostKeyChecking yes' \
            '  HostKeyAlgorithms ssh-ed25519' \
            '  BatchMode yes' \
            '  IdentitiesOnly yes' \
            '  PasswordAuthentication no' \
            '  PreferredAuthentications publickey' \
            '  ForwardAgent no' \
            '  ForwardX11 no' \
            '  ClearAllForwardings yes' \
            '  ConnectTimeout 10' \
            '  ServerAliveInterval 15' \
            '  ServerAliveCountMax 3' \
            '  RequestTTY no' \
            '  LogLevel ERROR' > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"

      - name: Log in to GHCR from EC2 using stdin
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set +x
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*(\[bot\])?$ ]] || exit 1
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | ssh -F "$RUNNER_TEMP/trekkey-sui-ssh/config" \
            trekkey-sui-release \
            "sudo -n docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Request exact-SHA release through the approved server helper
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          # The root-owned helper additionally requires its exact-SHA approval marker and
          # completed backup/schema/legacy-readback prerequisites. It owns release/rollback.
          ssh -F "$RUNNER_TEMP/trekkey-sui-ssh/config" trekkey-sui-release \
            "sudo -n test -f /opt/trekkey/sui-release/deploy-service.sh && \
             sudo -n test ! -L /opt/trekkey/sui-release/deploy-service.sh && \
             test \"\$(sudo -n stat -c '%u:%g:%a:%h' /opt/trekkey/sui-release/deploy-service.sh)\" = '0:0:700:1' && \
             sudo -n /opt/trekkey/sui-release/deploy-service.sh '$VERIFIED_SHA'" </dev/null

      - name: Remove temporary SSH files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/trekkey-sui-ssh/id_deploy" \
            "$RUNNER_TEMP/trekkey-sui-ssh/known_hosts" \
            "$RUNNER_TEMP/trekkey-sui-ssh/config"
